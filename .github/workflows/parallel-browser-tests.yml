name: Parallel Browser Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  parallel-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox, edge]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests for ${{ matrix.browser }}
      run: mvn clean test -Pci -Dbrowser=${{ matrix.browser }} -DskipTests=false
      continue-on-error: true

    - name: Upload ${{ matrix.browser }} Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.browser }}-reports
        path: target/reports/

    - name: Upload ${{ matrix.browser }} Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.browser }}-screenshots
        path: target/screenshots/

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.browser }}-logs
        path: target/logs/

