# Base framework configuration.
# Priority order: -D system property > environment variable > config-<env>.properties > this file.

execution.env=qa

# Browser and execution
browser=chrome
headless=false

# Selenium Grid
grid.enabled=true
grid.url=http://10.0.0.153:4444

# Application test data
base.url=https://qaplayground.com/bank/login
app.username=standard_user
app.password=bank_sauce
app.invalid.username=invalid_user
app.invalid.password=invalid_password

# Timeouts (seconds)
wait.timeout=15
page.load.timeout=30
script.timeout=30
implicit.wait.timeout=0

# Screenshot behavior
screenshot.on.failure=true
screenshot.on.pass=false
screenshot.attach.to.report=true
screenshot.output.dir=target/screenshots
