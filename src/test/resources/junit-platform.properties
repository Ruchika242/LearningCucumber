cucumber.glue=stepDefinations,hooks

cucumber.publish.quiet=true
cucumber.publish.enabled=false

cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3

cucumber.plugin=pretty,summary,html:target/reports/cucumber/cucumber.html,json:target/reports/cucumber/cucumber.json,junit:target/reports/cucumber/cucumber.xml,rerun:target/reports/cucumber/rerun.txt,reporting.ProfessionalCucumberHtmlPlugin
